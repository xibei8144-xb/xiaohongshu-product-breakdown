name: Validate skill
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chinese font
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: npm ci
      - run: npm run check
      - run: npm test
